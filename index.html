<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boarding Summary</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        input[type="text"], input[type="time"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px; /* ป้องกัน iOS ซูม */
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        .counter-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .counter-btn {
            background-color: #3498db;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .counter-btn.minus { background-color: #e74c3c; }
        .counter-value {
            font-size: 20px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }
        .btn-generate, .btn-copy {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn-generate { background-color: #2ecc71; }
        .btn-copy { background-color: #f39c12; }
        .result-area {
            width: 100%;
            height: 200px;
            margin-top: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #eee;
            font-size: 14px;
            resize: none;
        }
        hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>บันทึกข้อมูล Boarding</h2>
    
    <!-- ข้อมูลเที่ยวบิน -->
    <div class="row">
        <div class="form-group">
            <label>Flight No.</label>
            <input type="text" id="flightNo" placeholder="เช่น PG 109">
        </div>
        <div class="form-group">
            <label>เวลา</label>
            <input type="time" id="flightTime">
        </div>
        <div class="form-group">
            <label>GATE</label>
            <input type="text" id="gate" placeholder="เช่น A9">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>จาก (Origin)</label>
            <input type="text" id="origin" placeholder="เช่น BKK">
        </div>
        <div class="form-group">
            <label>ปลายทาง (Dest)</label>
            <input type="text" id="destination" placeholder="เช่น USM">
        </div>
    </div>

    <hr>

    <!-- ระบบนับจำนวน -->
    <label>ผู้โดยใช้ BIO (คน)</label>
    <div class="counter-group">
        <button class="counter-btn minus" onclick="updateCounter('bio', -1)">-</button>
        <span class="counter-value" id="bioVal">0</span>
        <button class="counter-btn" onclick="updateCounter('bio', 1)">+</button>
    </div>

    <label>ผ่าน (คน)</label>
    <div class="counter-group">
        <button class="counter-btn minus" onclick="updateCounter('pass', -1)">-</button>
        <span class="counter-value" id="passVal">0</span>
        <button class="counter-btn" onclick="updateCounter('pass', 1)">+</button>
    </div>

    <label>ไม่ผ่าน (คน)</label>
    <div class="counter-group">
        <button class="counter-btn minus" onclick="updateCounter('fail', -1)">-</button>
        <span class="counter-value" id="failVal">0</span>
        <button class="counter-btn" onclick="updateCounter('fail', 1)">+</button>
    </div>

    <hr>

    <!-- สถานะระบบ -->
    <div class="form-group">
        <label>Set flight</label>
        <select id="setFlight">
            <option value="ได้ปกติ">ได้ปกติ</option>
            <option value="ไม่ปกติ">ไม่ปกติ</option>
        </select>
    </div>
    <div class="form-group">
        <label>Lane A Biometric</label>
        <select id="laneA">
            <option value="ได้ปกติ">ได้ปกติ</option>
            <option value="ไม่ปกติ">ไม่ปกติ</option>
        </select>
    </div>
    <div class="form-group">
        <label>Lane B สแกน Boarding pass</label>
        <select id="laneB">
            <option value="ได้ปกติ">ได้ปกติ</option>
            <option value="ไม่ปกติ">ไม่ปกติ</option>
        </select>
    </div>

    <div class="form-group">
        <label>หมายเหตุ</label>
        <textarea id="remarks" rows="2" placeholder="ใส่หมายเหตุ (ถ้ามี)"></textarea>
    </div>

    <button class="btn-generate" onclick="generateReport()">สร้างข้อความสรุป</button>

    <textarea id="resultArea" class="result-area" readonly placeholder="ข้อความสรุปจะแสดงที่นี่..."></textarea>
    
    <button class="btn-copy" onclick="copyText()">คัดลอกข้อความ</button>

</div>

<script>
    // ตัวแปรเก็บจำนวนนับ
    let counts = { bio: 0, pass: 0, fail: 0 };

    // ฟังก์ชันอัปเดตตัวเลข
    function updateCounter(type, change) {
        counts[type] += change;
        if (counts[type] < 0) counts[type] = 0; // ไม่ให้ติดลบ
        document.getElementById(type + 'Val').innerText = counts[type];
    }

    // ฟังก์ชันสร้างข้อความสรุป
    function generateReport() {
        const flightNo = document.getElementById('flightNo').value || "[ไฟต์นัมเบอร์]";
        const flightTime = document.getElementById('flightTime').value || "[เวลา]";
        const gateInput = document.getElementById('gate').value;
        const gate = gateInput ? `GATE ${gateInput}` : "[GATE]";
        const origin = document.getElementById('origin').value || "[จาก]";
        const dest = document.getElementById('destination').value || "[ปลายทาง]";
        
        const setFlight = document.getElementById('setFlight').value;
        const laneA = document.getElementById('laneA').value;
        const laneB = document.getElementById('laneB').value;
        const remarks = document.getElementById('remarks').value;

        // จัดรูปแบบข้อความ
        let text = `${flightNo} ${flightTime} ${gate}\n`;
        text += `${origin} to ${dest}\n`;
        text += `ผู้โดยใช้ BIO = ${counts.bio} คน\n`;
        text += `ผ่าน = ${counts.pass} คน\n`;
        text += `ไม่ผ่าน = ${counts.fail} คน\n`;
        text += `Set flight ${setFlight}\n`;
        text += `Lane A Biometric ${laneA}\n`;
        text += `Lane B สแกน Boarding pass ${laneB}`;
        
        if (remarks.trim() !== "") {
            text += `\n*${remarks}`;
        }

        document.getElementById('resultArea').value = text;
    }

    // ฟังก์ชันคัดลอกข้อความ
    function copyText() {
        const resultArea = document.getElementById('resultArea');
        if(resultArea.value === "") {
            alert("กรุณากด 'สร้างข้อความสรุป' ก่อนคัดลอกครับ!");
            return;
        }
        
        // เลือกและคัดลอก
        resultArea.select();
        resultArea.setSelectionRange(0, 99999); // สำหรับมือถือ
        navigator.clipboard.writeText(resultArea.value).then(() => {
            alert("คัดลอกข้อความแล้ว!");
        }).catch(err => {
            alert("ไม่สามารถคัดลอกได้ กรุณาคลุมดำคัดลอกเองครับ");
        });
    }
</script>

</body>
</html>
